    <style>
        body{
    font-family: "Montserrat", sans-serif;
    margin:0.5rem;
    background-color:black;
    color:white;
    overflow:hidden;
}
.main{
    display:flex;
    height:100vh;
    padding:0.5rem;
}
.sidebar{
    background-color:black;
    background-image:linear-gradient(Cyan,black,pink);
    width:323px;
    border-radius:1rem;
    margin-right:0.5rem;
}
.main-content{
    background-color:#121212;
    flex: 1;
    border-radius:1rem;
    overflow: scroll;
    padding:0 1.5rem 0 1.5rem;
    height: 100%;
    
}
.music-player{
    background-color:black;
    position:fixed;
    bottom:0;
    width:100%;
    height:72px;
}
a{
    text-decoration:none;
    color:white;
}
.nav{
    background-color:#121212;
    border-radius:1rem;
    display:flex;
    justify-content: center;
    top:0;
}
.nav-options .login{
    -ms-flex-align: end;
}
.logo{
    height:2.5rem;
    width:2.5rem;
    border-radius: 50%;
    margin-top: 0.25rem;
    margin-right:25rem;
}
.nav-options i{
    font-size:1.25rem;
}
.nav-options a{
    font-size:1rem;
}
.nav-options{
    opacity: 0.7;
}
.nav-options:hover{
    opacity: 1;
}
.library{
    background-color:#121212;
    background-image:linear-gradient(Cyan,black,pink);
    border-radius:1rem;
    height:100%;
    width:300px;
    padding:0.5rem 0.75rem;
}
.library a{
    color:black;
}
.library p{
    color:white;
}
.library i{
    cursor: pointer;
}
.icon-container{
    background-color: #3a3a3a;
    border-radius:50%;
    display:flex;
    align-items: center;
    justify-content: center;
    width:3rem;
    height:3rem;
    margin-right:0.5rem;
    
}
.searchoption{
    position:absolute;
    top:1.7rem;
    left:34.5rem;
    z-index: 2;
}
.search{
    border-radius:2rem;
    padding-top:0.85rem;
    padding-bottom:0.85rem;
    padding-left:3rem;
    padding-right:4rem; 
    margin-left:0.25rem;
    margin-right:3rem;
    margin-top:0rem;
    width:400px;
    background-color: #3a3a3a;
}
input[type="search"]{
    color:white;
}
input::placeholder{
    color:#f0efef;
    font-family: inherit;
}
.sign-in{
    display:flex;
    align-items:center;
    margin-top:1rem;
    margin-left:10rem;
}
.login{
    display:flex;
    align-items: center;
    opacity: 1;
    margin-left:2.5rem;
    background-color:white;
    border-radius: 3rem;
    width:5.25rem; 
    padding:0.5rem 0.25rem 1rem 0.35rem;
}
.login a{
    color:black;
    padding-left:1rem;
    padding-right:1rem;
    padding-top:0.5rem;
}
.options{
    display:flex;
    justify-content: space-between;
    align-items:center;
}
.library-option i{
    font-size:1.25rem;
}
.icons{
    font-size:1.25rem;
    display:flex;
}
.icons i{
    opacity: 0.7;
    margin-right: 1rem;
}
.icons i:hover{
    opacity: 1;
}
.boxes{
    background-color: #232323;
    height:8rem;
    border-radius:0.75rem;
    margin:0.75rem 0 1.75rem 0;
    padding:0.75rem 1rem;
}
.box1{
    font-size:1rem;
    font-weight: 500;
}
.box2{
    font-size:0.85rem;
    opacity:0.9;
}
.badge{
    background-color:white;
    border:none;
    border-radius:100px;
    padding:0.2rem 1rem;
    font-weight: 700;
    margin-top:0.5rem;
    height:2rem;
    width:fit-content;
}
.glor{
    background-color:#121212;
    overflow: scroll;
}
.glorypic{
    height: 300px;
    width:980px;
    background-image:linear-gradient(Cyan,black,pink);
    border-radius: 1rem;
    display:block;
}
.glorypic .ima{
    padding:20px;
    border-radius: 10%;
}
.glorypic .write{
    display:inline-block;
    position: relative;
    top: -10rem;
}
.text2nd{
    display: inline-block;
    position:relative;
    font-size: 50px;
    top:-1rem;
}
b{
    position: relative;
    top: -5rem;
    left:-4rem;
}
.about{
    display:inline-block;
    position:relative;
   
}
.about img{
    height:25px;
    width: 25px;
    border-radius: 50%; 
    position:relative;
    left:-20rem;  
    top:-2rem;
}
.artist{
    display: inline-block;
    position:relative;
    left:-20rem;
    width:200px;
    padding-left:10px;
    top: -2.5rem;
    font-size: smaller;
}
.artist a{
    position:relative;
    top:-4rem;
    left:11rem;
}
.info{
    display:inline-block;
    position:relative;
    display:inline-block;
    width:200px;
    padding-left:10px;
    opacity:0.65;
    top:-4.95rem;
    left:18rem;
}
.play{
    display:block;
}
.play i{
    background-color: #1ed760;
    height: 50px;
    width:50px;
    border-radius:50%;
    display:flex;
    align-items: center;
    justify-content:center;
    margin:20px;
    color:black;
    font-size:20px;
}
.play i:hover{
    height:52px;
    width:52px;
    font-size:22px;
}
.collective{
    display:inline-block;
    position:relative;
}
.plus{
    position:absolute;
    left: 110px;
    top: 32px;
}
.plus i{
    height:25px;
    width:25px;
    border:white solid;
    opacity: 0.7;
    display:flex;
    justify-content: center;
    align-items: center;
    border-radius:50%;
}
.plus i:hover{
    opacity: 1;
}
.three-dots{
    position:absolute;
    left:190px;
    top:38px;
}
.three-dots i{
   display:flex;
   opacity:0.7;
}
.three-dots i:hover{
    opacity:1;
}
.hdng{
    opacity:0.7;
    font-size: 13px;
}
.titl{
    display:inline-block;
    padding-left:30px;
}
.art{
    display:inline-block;
    padding-left:445px;
    
}
.time{
    display:inline-block;
    padding-left:350px;
}
.lining{
    width: 100%;
    border-top: 1px solid white;
    opacity: 0.1;
    margin-bottom:10px;
}
.song1st{
    margin-bottom:15px;
    font-weight: 500;
    padding:1rem 0rem;
}
.name{
    display:inline-block; 
    width:470px;
}
.artst{
    display:inline-block;
    width:390px;
    opacity:0.7;
}
.Time{
    display:inline-block;
    opacity:0.7;
}
.count{
    display:inline-block;
    padding-left:15px;
    width:20px;
    opacity:0.7;
}
.song1st:hover{
    background-color: #343434;
    cursor: pointer;
}
    </style>
