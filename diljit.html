    <style>
    body{
    font-family: "Montserrat", sans-serif;
    margin:0.5rem;
    background-color:black;
    color:white;
    overflow:hidden;
    }
    .main{
    display:flex;
    height:100vh;
    padding:0.5rem;
    }
    .sidebar{
    background-color:black;
    width:323px;
    border-radius:1rem;
    margin-right:0.5rem;
    }
    .main-content{
    background-color:#121212;
    background-image:linear-gradient(rgb(7, 211, 211) 10%,black,rgb(248, 140, 158) 40%, #121212, #121212);
    flex: 1;
    border-radius:15px;
    overflow: scroll;
    }
    a{
    text-decoration:none;
    color:white;
    }
    .nav{
    background-color:#121212;
    border-radius:1rem;
    display:flex;
    justify-content: center;
    top:0;
    }
    .nav-options .login{
    -ms-flex-align: end;
    }
    .logo{
    height:2.5rem;
    width:2.5rem;
    border-radius: 50%;
    margin-top: 0.25rem;
    margin-right:25rem;
    }
    .nav-options i{
    font-size:1.25rem;
    }
    .nav-options a{
    font-size:1rem;
    }
    .nav-options{
    opacity: 0.7;
    }
    .nav-options:hover{
    opacity: 1;
    }
    .library{
    background-color:#121212;
    color:black;
    background-image:linear-gradient(Cyan,black,pink);
    border-radius:1rem;
    height:100%;
    width:300px;
    padding:0.5rem 0.75rem;
    }
    .library a{
    color:black;
    }
    .library p{
    color:white;
    }
    .library i{
    cursor: pointer;
    }
    .icon-container{
    background-color: #3a3a3a;
    border-radius:50%;
    display:flex;
    align-items: center;
    justify-content: center;
    width:3rem;
    height:3rem;
    margin-right:0.5rem;
    
    }
    .searchoption{ 
    position:relative; 
    margin-top:-0.4rem;
    top:1.35rem; 
    left:1.6rem; 
    z-index: 2; 
    }
    .search{
    border-radius:2rem;
    padding-top:0.85rem;
    padding-bottom:0.85rem;
    padding-left:3rem;
    padding-right:4rem; 
    margin-left:0.25rem;
    margin-top:-0.7rem;
    margin-right:3rem;
    width:400px;
    background-color: #3a3a3a;
    }
    input[type="search"]{
    color:white;
    }
    input::placeholder{
    color:#f0efef;
    font-family: inherit;
    }
    .sign-in{
    display:flex;
    align-items:center;
    margin-top:1rem;
    margin-left:10rem;
    }
    .login{
    display:flex;
    align-items: center;
    opacity: 1;
    margin-left:2.5rem;
    background-color:white;
    border-radius: 3rem;
    width:5.25rem; 
    padding:0.5rem 0.25rem 1rem 0.35rem;
    }
    .login a{
    color:black;
    padding-left:1rem;
    padding-right:1rem;
    padding-top:0.5rem;
    }
    .options{
    display:flex;
    justify-content: space-between;
    align-items:center;
    }
    .library-option i{
    font-size:1.25rem;
    }
    .icons{
    font-size:1.25rem;
    display:flex;
    }
    .icons i{
    opacity: 0.7;
    margin-right: 1rem;
    }
    .icons i:hover{
    opacity: 1;
    }
    .boxes{
    background-color: #232323;
    height:8rem;
    border-radius:0.75rem;
    margin:0.75rem 0 1.75rem 0;
    padding:0.75rem 1rem;
    }
    .box1{
    font-size:1rem;
    font-weight: 500;
    }
    .box2{
    font-size:0.85rem;
    opacity:0.9;
    }
    .badge{
    background-color:white;
    border:none;
    border-radius:100px;
    padding:0.2rem 1rem;
    font-weight: 700;
    margin-top:0.5rem;
    height:2rem;
    width:fit-content;
    }
    .dropdown{
    position:relative;
    display:inline-block;
    font-family:Arial,sans-serif;
    }
    .dropbtn{
    color:white;
    font-size:16px;
    cursor:pointer;
    padding:1-px;
    text-decoration:none;
    }
    .dropdown-content{
    display:none;
    background-color:#333;
    min-width:200px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    z-index: 1;
    }
    .dropdown-content a{
    color:white;
    padding:12px 16px;
    text-decoration:none;
    display:block;
    }
    .dropdown-content a:hover{
    background-color: #575757;
    }
.dropdown:hover .dropdown-content{display: block;}
.dropdown:hover .dropbtn{border-bottom: 2px solid white;}
.album{
    z-index:2;
    align-items: center;
    padding-right:1rem;
    padding-top:0.75rem;
    margin-top:18rem;
    position:relative;
    background-color: #121212;
    border-radius: 15px;
    margin-bottom:6rem;
}
.heading{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding-right:1rem;
    margin-bottom:-1rem;
}
.heading  a:hover{
    text-decoration:underline;
}
.heading h2{
    padding-left:1.5rem;
}
.card-title{
    font-weight:500;
    display:flex;
}
.cards{
    display:flex;
    flex-wrap: wrap;
}
.card{
    height:18rem;
    width:10rem;
    background-image: linear-gradient(rgb(3, 226, 226),rgb(0, 0, 0),rgb(253, 151, 168));
    border-radius:0.5rem;
    padding:1rem;
    margin:1rem;
    transition: box-shadow 0.5s ease;
}
.card:hover{
    transform: scale(1.1);
    box-shadow: 5px 5px 15px rgb(71, 71, 71);
}
.card img{
    height:9rem;
    width:9rem;
    border-radius:0.5rem;
    margin-left:0.5rem;
}
.card-info{
    opacity:0.9;
    font-size:0.9rem;
}

                <script>
                    // Get the image element
                    const image = document.getElementById('bigbackgroundimage');
                
                    // Set the maximum scroll distance before the image disappears
                    const maxScroll = 200; // The point where image will be completely faded
                
                    // Event listener for scroll event
                    window.addEventListener('scroll', function() {
                      // Get the current scroll position
                      const scrollY = window.scrollY;
                
                      // Calculate the opacity based on scroll position
                      let opacity = 1 - (scrollY / maxScroll);
                      
                      // Ensure opacity doesn't go below 0
                      if (opacity < 0) opacity = 0;
                
                      // Set the opacity of the image
                      image.style.opacity = opacity;
                    });
